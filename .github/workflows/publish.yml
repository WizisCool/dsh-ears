name: Publish Package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install -g npm@^11.15.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: npm publish --access public --provenance

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract changelog notes
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("CHANGELOG.md").read_text()
          version = "${{ github.ref_name }}".removeprefix("v")
          match = re.search(
              rf"(?m)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.S,
          )
          if match is None:
              raise SystemExit(f"no changelog section found for {version}")
          body = match.group(1).strip()
          if not body:
              raise SystemExit(f"empty changelog section for {version}")
          pathlib.Path("release-notes.md").write_text(
              body + "\n\nPublished to npm via trusted publishing (SLSA provenance).\n"
          )
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
