name: Publish Package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install -g npm@^11.15.0

      - run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm release:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:package
      - run: npm publish --access public --provenance

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          text = pathlib.Path("CHANGELOG.md").read_text()
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          match = re.search(
              rf"(?m)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.S,
          )
          if match is None:
              raise SystemExit(f"no changelog section found for {version}")
          body = match.group(1).strip()
          if not body:
              raise SystemExit(f"empty changelog section for {version}")
          pathlib.Path("release-notes.md").write_text(
              body + "\n\nPublished to npm via trusted publishing (SLSA provenance).\n"
          )
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release-notes.md
