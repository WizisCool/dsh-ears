name: CI

on:
  push:
    branches: [master, next]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Required branch-protection checks key on the OS only; keep the reported
    # name stable when the Node matrix changes.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '22.19.0'
          - os: ubuntu-latest
            node-version: '24.x'
          - os: windows-latest
            node-version: '24.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm use:platform
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:package

  compatibility:
    name: DSH compatibility smoke (${{ matrix.dsh-version }})
    strategy:
      fail-fast: false
      matrix:
        dsh-version: ['0.1.2-alpha.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm use:platform
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm compat:smoke -- --dsh-version ${{ matrix.dsh-version }}

  audit:
    name: Advisory production dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm use:platform
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
